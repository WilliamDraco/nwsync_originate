on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Upload Release Asset

jobs:
  Windows:
    name: Windows Binary
    runs-on: [windows-latest]
    steps:
      - name: Checkout git
        uses: actions/checkout@master
      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2.2.2
      - name: Get DLLs
        run: |
          curl --output dlls.zip https://nim-lang.org/download/dlls.zip
          tar -xf dlls.zip
      - name: build win binary
        run: |
          nimble refresh
          nimble build -d:release
      - name: Upload Windows files
        uses: actions/upload-artifact@v6
        with:
          name: winbin
          path: |
            sqlite3_64.dll
            pcre64.dll
            nwsync_originate.exe
  Linux:
    name: Linux Binary and Release
    needs: Windows
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@master
      - name: setup Nim # This would actually build your project, using zip for an example artifact
        uses: jiro4989/setup-nim-action@v2.2.2
      - name: Compile Project
        run: |
          nimble refresh
          nimble build -d:release
      - name: Zip Linux Asset
        run: zip nwsync_originate-linux.zip nwsync_originate
      - name: Retrieve Window Binary
        uses: actions/download-artifact@v7
        with:
          name: winbin
      - name: Zip Windows Asset
        run: zip nwsync_originate-windows.zip nwsync_originate.exe sqlite3_64.dll pcre64.dll
      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Release ${{ github.ref }}
          draft: true
          prerelease: false
          artifacts: ./nwsync_originate-linux.zip, ./nwsync_originate-windows.zip
          artifactContentType: application/zip
